<div class="card">
    <div class="card-body">
        <form #stdForm='ngForm' (ngSubmit) = 'onAddStd()'>
            <div class="form-group">
                <label for="fname">First Name</label>
                <input required ngModel name="fname" class="form-control" id="fname">
            </div>
            <div class="form-group">
                <label for="lname">Last Name</label>
                <input required ngModel name="lname" class="form-control" id="lname">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input required ngModel name="email" class="form-control" id="email">
            </div>
            <div class="form-group">
                <label for="contact">Contact</label>
                <input required ngModel name="contact" class="form-control" id="contact">
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select required ngModel name="status" class="form-control" id="status">
                    <option value="Active">Active</option>
                    <option value="In-Active">In-Active</option>
                </select> 
            </div>
            <button [disabled] = 'stdForm.invalid' *ngIf = '!isEditMode' type="submit" class="btn-block" mat-raised-button color="primary">Add Student</button>
            <button
            (click) = 'onUpdate()'
            *ngIf = 'isEditMode' type="button" class="btn-block" mat-raised-button color="primary">Update Student</button>
            <button 
            (click) = 'onCancel()'
            *ngIf = 'isEditMode' type="button" class="btn-block" mat-raised-button color="primary">Cancel</button>
        </form>
    </div>
</div>
